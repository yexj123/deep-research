<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Research</title>
  <!-- An inline SVG data URI rather than a file: browsers request /favicon.ico unprompted,
       and the 404 was the only console error on the page (found by /demo-check, 2026-09-24).
       Declaring one here stops the request being made at all, so there is no route to add and
       no binary in the repo. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#128218;</text></svg>">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Deep Research</div>
    <button type="button" id="new-run" class="new-run">+ New research</button>

    <h2 class="sidebar-heading">History</h2>
    <!-- htmx loads this on page load and again after each run finishes. Each entry swaps
         that run into #loaded-run, server-rendered (D-080). -->
    <ul id="history" class="history"
        hx-get="/history" hx-trigger="load, refresh-history from:body"></ul>
  </aside>

  <main>
    <form id="ask">
      <label for="question">Research question</label>
      <textarea id="question" name="question" rows="3" required
                placeholder="What is attention in transformer models?"></textarea>

      <div class="row">
        <label for="provider">Model</label>
        <select id="provider" name="provider">
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
        </select>
        <button type="submit" id="submit">Research</button>
      </div>
    </form>

    <!-- The run happening now. Separate from #loaded-run on purpose: htmx replaces that
         container wholesale, which would drop the elements the streaming code writes into. -->
    <section id="live-run" hidden>
      <!-- The question actually being researched. For a follow-up this is the *rewritten*
           one (D-121), which is why it's shown at all: the server resolved "what about it?"
           into something searchable, and the reader should see what it resolved to. -->
      <h2 class="question" id="live-question" hidden></h2>

      <h2>Progress</h2>
      <ol id="progress"></ol>

      <h2>Review</h2>
      <!-- Plain text while streaming (textContent, never innerHTML). The formatted version
           arrives with the done event, already escaped server-side (D-085). -->
      <article id="review"></article>
      <p id="violations" class="warn" hidden></p>
      <aside id="coverage" class="coverage" hidden></aside>
    </section>

    <!-- A past conversation, swapped in by htmx from the sidebar. -->
    <section id="loaded-run"></section>

    <!-- The follow-up composer (D-121). One form for both panes, because a live run and a
         loaded one are never on screen together -- "the conversation you're looking at" is
         always unambiguous. #follow-up-to holds the thread being continued. -->
    <form id="follow-up" hidden>
      <label for="follow-up-question">Follow up on this conversation</label>
      <textarea id="follow-up-question" name="question" rows="2" required
                placeholder="What about quantization?"></textarea>
      <div class="row">
        <p class="meta" id="follow-up-note">
          Asked as a new run. References like &ldquo;it&rdquo; or &ldquo;that&rdquo; are
          resolved against the answer above before searching.
        </p>
        <button type="submit" id="follow-up-submit">Ask</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
          crossorigin="anonymous"></script>
  <script src="/static/app.js"></script>
</body>
</html>
