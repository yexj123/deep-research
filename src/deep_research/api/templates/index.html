<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Research</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Deep Research</div>
    <button type="button" id="new-run" class="new-run">+ New research</button>

    <h2 class="sidebar-heading">History</h2>
    <!-- htmx loads this on page load and again after each run finishes. Each entry swaps
         that run into #loaded-run, server-rendered (D-080). -->
    <ul id="history" class="history"
        hx-get="/history" hx-trigger="load, refresh-history from:body"></ul>
  </aside>

  <main>
    <form id="ask">
      <label for="question">Research question</label>
      <textarea id="question" name="question" rows="3" required
                placeholder="What is attention in transformer models?"></textarea>

      <div class="row">
        <label for="provider">Model</label>
        <select id="provider" name="provider">
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
        </select>
        <button type="submit" id="submit">Research</button>
      </div>
    </form>

    <!-- The run happening now. Separate from #loaded-run on purpose: htmx replaces that
         container wholesale, which would drop the elements the streaming code writes into. -->
    <section id="live-run" hidden>
      <h2>Progress</h2>
      <ol id="progress"></ol>

      <h2>Review</h2>
      <!-- Plain text while streaming (textContent, never innerHTML). The formatted version
           arrives with the done event, already escaped server-side (D-085). -->
      <article id="review"></article>
      <p id="violations" class="warn" hidden></p>
      <aside id="coverage" class="coverage" hidden></aside>
    </section>

    <!-- A past run, swapped in by htmx from the sidebar. -->
    <section id="loaded-run"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
          crossorigin="anonymous"></script>
  <script src="/static/app.js"></script>
</body>
</html>
