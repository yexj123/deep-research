[project]
name = "deep-research"
version = "0.1.0"
description = "Self-hosted deep research agent: recursive literature review with LangGraph, streamed to a web UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "XIAOJUN YE", email = "xiaojun.ye1312@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.6.3",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "asgi-lifespan>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests make paid API calls: deselected by default, run with `uv run pytest -m integration`.
addopts = ["--strict-markers", "-m", "not integration"]
markers = [
    "integration: calls real LLM APIs; skipped unless that provider's API key is set",
]
